<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Points Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6eeff; --surface: #ffffff; --raised: #f3f6ff; --text: #1b2858; --muted: #5d6a96;
    --track: #d6dff7; --plus: #12865a; --minus: #c93a3a; --ink-on: #ffffff;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141c44; --surface: #1f2a5e; --raised: #283570; --text: #fff4dc; --muted: #a9b3db;
      --track: #34418a; --plus: #5be0a0; --minus: #ff8a8a; --ink-on: #141c44;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141c44; --surface: #1f2a5e; --raised: #283570; --text: #fff4dc; --muted: #a9b3db;
    --track: #34418a; --plus: #5be0a0; --minus: #ff8a8a; --ink-on: #141c44;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Baloo 2", "Trebuchet MS", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 4px solid var(--text); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ============ TV board ============ */
  /* Sized in rem, and rem follows the screen width, so 960x540 and 1920x1080 look the same */
  html { font-size: clamp(11px, .9vw, 24px); }
  body.on-board { background: #1A1540; }
  .tv {
    --night: #1A1540; --night-2: #231C55; --line: rgba(255,255,255,.09); --ink: #F6F3FF; --dim: #A9A2D6;
    --sun: #FFD45C; --sun-ink: #3A2600; --pink: #FF5CB8; --violet: #8A45F5; --ice: #8BE0FF; --frost: #EAF9FF;
    height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 1.2rem; padding: 1.4rem 2rem 1.1rem;
    background: radial-gradient(ellipse 80% 60% at 50% -10%, #3B2F88 0%, var(--night) 60%); color: var(--ink);
    font-family: "Fredoka", "Baloo 2", "Trebuchet MS", sans-serif; overflow: hidden;
  }
  .tv .top { display: flex; align-items: baseline; justify-content: space-between; }
  .tv .top h1 { margin: 0; font-size: 2.3rem; font-weight: 700; letter-spacing: -.01em; }
  .tv .when { display: flex; align-items: baseline; gap: 1.2rem; }
  .tv .date { font-size: 1.8rem; font-weight: 500; color: var(--dim); }
  .tv .clock { font-size: 2.3rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tv .board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.8fr) minmax(0, 1fr); gap: 1.2rem; min-height: 0; }
  .tv .foot { display: flex; justify-content: space-between; align-items: center; }
  .tv .status { font-size: 1.05rem; color: var(--dim); }
  .tv .grownups { font: inherit; font-size: 1.3rem; font-weight: 600; color: #2A2050; background: #FFF4D6; border: 0; border-radius: 999px; padding: .6rem 1.5rem; display: inline-flex; align-items: center; gap: .5rem; cursor: pointer; }
  .tv .grownups:focus-visible { outline: 4px solid var(--sun); outline-offset: 4px; }
  body.on-board .toast { background: #FFF4D6; color: #2A2050; bottom: calc(5rem + env(safe-area-inset-bottom, 0px)); white-space: normal; max-width: calc(100vw - 32px); text-align: center; }

  /* Kid cards */
  .kidcard { position: relative; overflow: hidden; border-radius: 2.2rem; min-height: 0; min-width: 0; isolation: isolate; }
  .kidcard > .content { position: relative; z-index: 1; height: 100%; padding: 1.4rem 1.3rem 2.4rem; display: flex; flex-direction: column; gap: 1rem; overflow: hidden; }
  .world { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .world .scenery { position: absolute; left: 0; bottom: 0; width: 100%; height: 30%; }
  .twinkle { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); border-radius: 50%; background: rgba(255,255,255,.8); animation: twinkle var(--d) ease-in-out infinite; animation-delay: var(--t); }
  .twinkle.pinkstar { background: rgba(255,220,245,.85); }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
  .star4 { clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }

  .kc-head { display: flex; align-items: center; gap: .9rem; }
  .kc-av { width: 4.4rem; height: 4.4rem; border-radius: 50%; display: grid; place-items: center; font-size: 2.5rem; flex: none; }
  .kc-av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .kc-name { margin: 0; font-size: 3.4rem; font-weight: 700; line-height: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  .bank { flex: 1; min-height: 8rem; display: flex; gap: .6rem; padding-top: 1.4rem; }
  .tower { position: relative; width: 3.4rem; flex: none; }
  .tower-track { position: absolute; inset: 0; border-radius: 1.7rem; overflow: hidden; }
  .tower-fill { position: absolute; inset: 0; border-radius: 1.7rem; }
  .goal-mark { position: absolute; left: 100%; margin-left: .45rem; transform: translateY(50%); display: flex; align-items: center; gap: .3rem; font-size: 1.1rem; font-weight: 600; white-space: nowrap; opacity: .55; }
  .goal-mark.got { opacity: 1; }
  .goal-mark .gi { width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; }
  .goal-mark.got .gi { box-shadow: 0 0 0 3px var(--sun), 0 0 1.2rem rgba(255,212,92,.6) !important; }
  .score { margin-left: auto; min-width: 0; text-align: right; display: flex; flex-direction: column; justify-content: center; }
  .score-num { font-size: var(--num, 7rem); font-weight: 700; line-height: .85; font-variant-numeric: tabular-nums; }
  .score-l { font-size: 1.4rem; font-weight: 500; margin-top: .3rem; }
  .next { margin-top: .8rem; font-size: 1.25rem; font-weight: 500; display: inline-flex; align-items: center; justify-content: flex-end; gap: .35rem; }
  .next span { font-size: 1.9rem; }

  .jobs { border-radius: 1.5rem; padding: 1rem 1rem .9rem; }
  .jobs-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .6rem; padding: 0 .2rem; gap: .5rem; }
  .jobs-h h3 { margin: 0; font-size: 1.35rem; font-weight: 600; }
  .jobs-h span { font-size: 1.2rem; font-weight: 500; opacity: .8; white-space: nowrap; }
  .jobs ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
  .jobs-none { margin: 0; font-size: 1.2rem; opacity: .7; padding: 0 .2rem; }
  /* Each job is a button: tap to tick it off (writes to the sheet), tap again to undo */
  .job .tick { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: .8rem; cursor: pointer; border-radius: 1rem; -webkit-tap-highlight-color: transparent; }
  .job .tick:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .job .tick:active .job-i { transform: scale(.9); }
  .job-i { position: relative; flex: none; width: 3.4rem; height: 3.4rem; border-radius: 1.05rem; display: grid; place-items: center; font-size: 2rem; transition: transform .12s; }
  .job-ok { position: absolute; right: -.45rem; bottom: -.45rem; width: 1.6rem; height: 1.6rem; border-radius: 50%; display: grid; place-items: center; background: var(--sun); color: var(--sun-ink); font-size: 1rem; font-weight: 700; box-shadow: 0 0 0 3px var(--card-bg); }
  .job-n { flex: 1; min-width: 0; font-size: 1.4rem; font-weight: 600; line-height: 1.15; }
  .job-p { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .job.done .job-n { opacity: .55; }

  /* Millie: pop star stage at night */
  .kid-pop { --card-bg: #2A0F4D; background: linear-gradient(175deg, #4E1C82 0%, #2E1056 55%, #1D0938 100%); box-shadow: inset 0 0 0 2px rgba(255,92,184,.45), 0 0 3rem rgba(255,92,184,.15); }
  .kid-pop .beam { position: absolute; inset: 0; animation: glow 6s ease-in-out infinite alternate; }
  .kid-pop .b1 { background: conic-gradient(from 168deg at 22% -8%, transparent 0deg, rgba(255,140,220,.16) 8deg, transparent 16deg); }
  .kid-pop .b2 { background: conic-gradient(from 186deg at 80% -8%, transparent 0deg, rgba(160,120,255,.17) 9deg, transparent 18deg); animation-delay: -3s; }
  @keyframes glow { from { opacity: .45; } to { opacity: 1; } }
  .kid-pop .wins { animation: windows 4s steps(2) infinite; }
  @keyframes windows { 50% { opacity: .55; } }
  .kid-pop .spark { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); background: #fff; opacity: 0; animation: rise var(--d) linear infinite; animation-delay: var(--t); }
  .kid-pop .spark.gold { background: #FFD45C; } .kid-pop .spark.pink { background: #FF9AD5; }
  @keyframes rise { 0% { transform: translateY(0) scale(.5); opacity: 0; } 15% { opacity: 1; } 70% { opacity: .8; } 100% { transform: translateY(-40vh) scale(1.1); opacity: 0; } }
  .kid-pop .kc-av { background: #1D0938; box-shadow: 0 0 0 4px var(--pink), 0 0 1.4rem rgba(255,92,184,.6); }
  .kid-pop .kc-name { color: #FFE3F4; text-shadow: 0 0 1.2rem rgba(255,92,184,.9), 0 0 .2rem var(--pink); }
  .kid-pop .score-num { color: #FFE3F4; text-shadow: 0 0 1.4rem rgba(255,92,184,.8); }
  .kid-pop .score-l, .kid-pop .goal-mark, .kid-pop .next { color: #FFB8E1; }
  .kid-pop .tower-track { background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 2px rgba(255,92,184,.35); }
  .kid-pop .tower-fill { background: linear-gradient(0deg, var(--violet), var(--pink) 70%, #FFB3E0); box-shadow: 0 0 1.4rem rgba(255,92,184,.7); }
  .kid-pop .gi { background: #1D0938; box-shadow: 0 0 0 2px rgba(255,92,184,.5); }
  .kid-pop .jobs { background: rgba(20,5,40,.72); box-shadow: inset 0 0 0 1px rgba(255,92,184,.25); }
  .kid-pop .job-i { background: rgba(255,92,184,.14); }
  .kid-pop .job.done .job-i { background: var(--pink); }
  .kid-pop .job-p { color: var(--pink); }

  /* Grace: snowy mountains */
  .kid-ice { --card-bg: #17396B; background: linear-gradient(175deg, #2560A8 0%, #1A4580 50%, #102C57 100%); box-shadow: inset 0 0 0 2px rgba(139,224,255,.5), 0 0 3rem rgba(139,224,255,.15); }
  .kid-ice .aurora { position: absolute; inset: 0; animation: drift 14s ease-in-out infinite alternate; }
  .kid-ice .a1 { background: radial-gradient(ellipse 120% 40% at 30% 18%, rgba(160,255,220,.18), transparent 70%); }
  .kid-ice .a2 { background: radial-gradient(ellipse 90% 30% at 80% 8%, rgba(190,160,255,.2), transparent 70%); animation-duration: 19s; animation-delay: -6s; }
  @keyframes drift { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
  .kid-ice .snow { position: absolute; top: -3%; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; background: #fff; opacity: .9; animation: fall var(--d) linear infinite; animation-delay: var(--t); }
  @keyframes fall { to { transform: translate3d(var(--drift), 80vh, 0); } }
  .kid-ice .kc-av { background: var(--frost); box-shadow: 0 0 0 4px var(--ice), 0 0 1.4rem rgba(139,224,255,.7); }
  .kid-ice .kc-name { color: #fff; text-shadow: 0 0 1.2rem rgba(139,224,255,.9), 0 0 .2rem var(--ice); }
  .kid-ice .score-num { color: #fff; text-shadow: 0 0 1.4rem rgba(139,224,255,.85); }
  .kid-ice .score-l, .kid-ice .goal-mark, .kid-ice .next { color: #C4EEFF; }
  .kid-ice .tower-track { background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 2px rgba(139,224,255,.4); }
  .kid-ice .tower-fill { background: linear-gradient(0deg, #3E8BFF, var(--ice) 65%, #fff); box-shadow: 0 0 1.4rem rgba(139,224,255,.75); }
  .kid-ice .gi { background: #0F2A52; box-shadow: 0 0 0 2px rgba(139,224,255,.5); }
  .kid-ice .jobs { background: rgba(8,25,55,.72); box-shadow: inset 0 0 0 1px rgba(139,224,255,.28); }
  .kid-ice .job-i { background: rgba(139,224,255,.15); }
  .kid-ice .job.done .job-i { background: var(--ice); }
  .kid-ice .job-p { color: var(--ice); }

  /* Tighter steps, added by fitCards() only when a card would otherwise cut off its jobs */
  .content[data-fit] { gap: .7rem; padding-top: 1.1rem; padding-bottom: 1.6rem; }
  .content[data-fit] .kc-av { width: 3.4rem; height: 3.4rem; font-size: 1.9rem; }
  .content[data-fit] .kc-name { font-size: 2.7rem; }
  .content[data-fit] .bank { min-height: 6.5rem; padding-top: 1.1rem; }
  .content[data-fit] .job-i { width: 3rem; height: 3rem; font-size: 1.75rem; }
  .content[data-fit="2"] .jobs, .content[data-fit="3"] .jobs, .content[data-fit="4"] .jobs, .content[data-fit="5"] .jobs { padding: .7rem .8rem; }
  .content[data-fit="2"] .jobs ul, .content[data-fit="3"] .jobs ul { gap: .35rem; }
  .content[data-fit="2"] .job-i, .content[data-fit="3"] .job-i { width: 2.6rem; height: 2.6rem; font-size: 1.5rem; border-radius: .8rem; }
  .content[data-fit="2"] .job-n, .content[data-fit="3"] .job-n, .content[data-fit="2"] .job-p, .content[data-fit="3"] .job-p { font-size: 1.2rem; }
  .content[data-fit="3"] .bank, .content[data-fit="4"] .bank, .content[data-fit="5"] .bank { min-height: 5.5rem; }
  .content[data-fit="3"] .score-num, .content[data-fit="4"] .score-num, .content[data-fit="5"] .score-num { font-size: calc(var(--num, 7rem) * .78); }
  /* Steps 4 and 5: pictures only, in a grid. The girls can't read yet anyway. */
  .content[data-fit="4"] .jobs ul, .content[data-fit="5"] .jobs ul { grid-template-columns: repeat(auto-fill, minmax(3.6rem, 1fr)); gap: .5rem; }
  .content[data-fit="4"] .job .tick, .content[data-fit="5"] .job .tick { flex-direction: column; gap: .15rem; }
  .content[data-fit="4"] .job-n, .content[data-fit="5"] .job-n { display: none; }
  .content[data-fit="4"] .job-p, .content[data-fit="5"] .job-p { font-size: 1rem; }
  .content[data-fit="4"] .job-i, .content[data-fit="5"] .job-i { width: 2.8rem; height: 2.8rem; font-size: 1.6rem; border-radius: .8rem; }
  .content[data-fit="5"] .next { display: none; }
  .content[data-fit="5"] .kc-name { font-size: 2.2rem; }
  .content[data-fit="5"] .kc-av { width: 2.8rem; height: 2.8rem; font-size: 1.6rem; }

  /* Week calendar: days across, hours down, every event at its time */
  .week { background: var(--night-2); border-radius: 2.2rem; box-shadow: inset 0 0 0 1px var(--line); padding: 1.2rem 1.1rem 1rem; display: flex; flex-direction: column; gap: .7rem; min-height: 0; min-width: 0; }
  .wk-head { display: flex; justify-content: space-between; align-items: center; padding: 0 .4rem; gap: 1rem; }
  .wk-head h2 { margin: 0; font-size: 1.9rem; font-weight: 600; }
  .legend { display: flex; gap: 1.1rem; font-size: 1.1rem; color: var(--dim); }
  .legend span { display: inline-flex; align-items: center; gap: .45rem; }
  .legend i { width: 1rem; height: 1rem; border-radius: .3rem; display: inline-block; }
  .wk-body { flex: 1; min-height: 0; display: flex; }
  .wk-grid { flex: 1; min-width: 0; display: grid; grid-template-columns: 3rem repeat(7, minmax(0, 1fr)); grid-template-rows: auto auto minmax(0, 1fr); column-gap: .35rem; }
  .wk-todaybg { grid-column: 2; grid-row: 1 / 4; border-radius: 1.2rem; background: rgba(255,212,92,.08); box-shadow: inset 0 0 0 2px rgba(255,212,92,.5); }
  .wk-day { grid-row: 1; text-align: center; padding: .5rem .1rem .45rem; display: flex; flex-direction: column; align-items: center; gap: .2rem; min-width: 0; }
  .wk-dn { font-size: 1.1rem; font-weight: 500; color: var(--dim); white-space: nowrap; }
  .wk-num { font-size: 1.9rem; font-weight: 600; line-height: 1; width: 2.9rem; height: 2.9rem; border-radius: 50%; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
  .wk-day.is-today .wk-dn { color: var(--sun); font-weight: 600; }
  .wk-day.is-today .wk-num { background: var(--sun); color: var(--sun-ink); font-weight: 700; }
  .wk-day.is-weekend .wk-num { color: #FFC2E4; }
  .wk-day.is-today.is-weekend .wk-num { color: var(--sun-ink); }
  .wk-spans { grid-row: 2; grid-column: 2 / -1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-flow: row dense; column-gap: .35rem; row-gap: .3rem; padding-bottom: .4rem; }
  .wk-span { border-radius: .8rem; padding: .35rem .6rem; display: flex; align-items: center; gap: .45rem; font-size: 1.1rem; font-weight: 600; min-width: 0; }
  .wk-span .wk-st { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wk-span .wk-when { font-weight: 500; opacity: .7; margin-left: .3rem; }
  .wk-hours { grid-row: 3; grid-column: 1; position: relative; }
  .wk-hours span { position: absolute; right: .2rem; top: var(--y); transform: translateY(-50%); font-size: .9rem; color: var(--dim); white-space: nowrap; }
  .wk-hours span:first-child { transform: none; }
  .wk-cols { grid-row: 3; grid-column: 2 / -1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); column-gap: .35rem; min-height: 0; }
  .wk-col { position: relative; min-width: 0; border-radius: .6rem; background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px calc(100% / var(--hours))); }
  .wk-ev { position: absolute; min-height: 4.7rem; border-radius: .6rem; padding: .3rem .35rem; overflow: hidden; display: flex; flex-direction: column; align-items: center; text-align: center; gap: .1rem; box-shadow: 0 0 0 2px var(--night-2); z-index: 1; }
  .wk-et { display: flex; flex-direction: column; align-items: center; font-size: .95rem; font-weight: 600; line-height: 1.1; min-width: 0; width: 100%; }
  .wk-et b { font-weight: inherit; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; max-width: 100%; }
  .wk-ev .wk-i { font-size: 1.5rem; }
  .wk-ev.is-kids .wk-i { font-size: 1.9rem; }
  .wk-i { flex: none; font-size: 1.3em; line-height: 1; }
  .wk-tm { font-size: .85rem; font-weight: 600; opacity: .8; font-variant-numeric: tabular-nums; white-space: nowrap; order: -1; }
  .is-kids { background: var(--sun); color: var(--sun-ink); }
  .is-grown { background: #3A3270; color: #DCD7FA; }
  .wk-ev.is-past { opacity: .4; }
  /* Three or more at once: just the pictures */
  .wk-ev.is-narrow { padding: .3rem 0; justify-content: center; }
  .wk-ev.is-narrow .wk-tm, .wk-ev.is-narrow b { display: none; }
  .wk-ev.is-narrow .wk-i { font-size: 1.25rem !important; }
  .wk-now { position: absolute; left: -.2rem; right: 0; height: 3px; background: #FF6B6B; border-radius: 2px; z-index: 2; transform: translateY(-50%); }
  .wk-now::before { content: ""; position: absolute; left: -.3rem; top: 50%; width: .8rem; height: .8rem; border-radius: 50%; background: #FF6B6B; transform: translateY(-50%); }
  .wk-empty { margin: auto; font-size: 1.3rem; color: var(--dim); }

  /* Matching buttons on the grown ups page */
  .kid.pop { background: linear-gradient(135deg, #1a0838, #5a1170 60%, #9b1f79); color: #fff; }
  .kid.ice { background: linear-gradient(135deg, #f2f9ff, #d6ebff 55%, #e3dbfb); color: #0b3760; }
  .kid.pop .emo { background: rgba(255,255,255,.18); box-shadow: 0 0 0 2px #ff4fd0; }
  .kid.ice .emo { background: #ffffff; box-shadow: 0 0 0 2px #8fc6f5; }
  .kid b { color: var(--balance, var(--c)); }
  .kid .emo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

  /* Phones: the two cards stay side by side, the calendar goes underneath and scrolls sideways */
  @media (max-width: 760px) {
    .tv { height: auto; min-height: 100vh; overflow: visible; padding: max(1rem, env(safe-area-inset-top)) .9rem calc(1rem + env(safe-area-inset-bottom, 0px)); grid-template-rows: auto auto auto; }
    .tv .top { flex-wrap: wrap; gap: .3rem; }
    .tv .top h1 { font-size: 2rem; }
    .tv .date { font-size: 1.3rem; } .tv .clock { font-size: 1.6rem; }
    .tv .board { grid-template-columns: 1fr 1fr; gap: .8rem; }
    .kidcard { border-radius: 1.6rem; }
    .kidcard > .content { height: auto; padding: 1rem .8rem 2rem; gap: .8rem; overflow: visible; }
    .kc-av { width: 3rem; height: 3rem; font-size: 1.7rem; }
    .kc-name { font-size: 2.2rem; }
    .bank { min-height: 9rem; }
    .score-num { font-size: calc(var(--num, 7rem) * .7); }
    .jobs { padding: .7rem .6rem; border-radius: 1.1rem; }
    .jobs-h { flex-direction: column; gap: 0; }
    .job .tick { min-height: 3rem; gap: .5rem; }
    .job-i { width: 2.8rem; height: 2.8rem; font-size: 1.6rem; }
    .job-n, .job-p { font-size: 1.2rem; }
    .week { order: 3; grid-column: 1 / -1; border-radius: 1.6rem; padding: 1rem .7rem; }
    .wk-head { flex-wrap: wrap; }
    .wk-body { overflow-x: auto; }
    .wk-grid { min-width: 46rem; height: 34rem; flex: none; }
  }

  /* ============ Gate and code screens ============ */
  .gate { max-width: 420px; margin: 0 auto; padding: 48px 20px; text-align: center; }
  .gate h1 { font-size: 28px; margin: 0 0 4px; }
  .gate p { color: var(--muted); margin: 0 0 24px; }
  .gate .sum { font-size: 60px; font-weight: 800; line-height: 1; margin-bottom: 20px; }
  .gate input { width: 100%; font: inherit; font-size: 32px; font-weight: 700; text-align: center; padding: 10px; border-radius: 14px; border: 3px solid var(--track); background: var(--surface); color: var(--text); }
  .gate input:focus { outline: none; border-color: var(--text); }
  .primary { margin-top: 12px; width: 100%; border: 0; border-radius: 14px; padding: 14px; background: var(--text); color: var(--bg); font-size: 20px; font-weight: 800; }
  .gate .wrong { color: var(--minus); font-weight: 700; min-height: 1.5em; margin-top: 10px; }
  .gate .back { display: inline-block; margin-top: 18px; color: var(--muted); font-weight: 700; background: none; border: 0; text-decoration: underline; padding: 6px; }

  /* ============ Grown ups page ============ */
  .admin { max-width: 560px; margin: 0 auto; padding: 0 16px 48px; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px; }
  .bar-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .bar-top h1 { font-size: 24px; margin: 0; }
  .ghost { background: transparent; border: 2px solid var(--track); border-radius: 999px; padding: 4px 14px; font-weight: 700; color: var(--muted); text-decoration: none; font-size: 15px; }
  .kids { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kid { background: var(--surface); border: 3px solid transparent; border-radius: 16px; padding: 8px 12px; text-align: left; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .kid .emo { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--c-soft); font-size: 20px; flex: none; }
  .kid b { margin-left: auto; font-size: 24px; color: var(--c); }
  .kid[aria-pressed="true"] { border-color: var(--c); }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); padding: 4px; border-radius: 14px; margin-top: 10px; }
  .tab { border: 0; background: transparent; border-radius: 10px; padding: 8px 0; font-weight: 700; font-size: 16px; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--text); color: var(--bg); }
  .admin h2 { font-size: 17px; margin: 18px 0 8px; color: var(--muted); display: flex; justify-content: space-between; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .act { background: var(--surface); border: 0; border-radius: 14px; padding: 12px; text-align: left; font-size: 16px; line-height: 1.2; min-height: 66px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
  .act .pts { font-weight: 800; font-size: 20px; color: var(--plus); }
  .act.neg .pts { color: var(--minus); }
  .act.spend .pts { color: var(--muted); }
  .act.small { min-height: 54px; font-size: 15px; }
  .act:disabled { opacity: .4; cursor: not-allowed; }
  .act:active:not(:disabled), .done-btn:active:not(:disabled) { transform: scale(.97); }
  .undo { margin-top: 18px; width: 100%; background: transparent; border: 2px solid var(--track); border-radius: 14px; padding: 12px; font-weight: 700; color: var(--muted); }
  .undo:disabled { opacity: .45; }
  .joblist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .joblist li { background: var(--surface); border-radius: 14px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 8px; font-size: 17px; min-height: 58px; }
  .joblist .jt { flex: 1; line-height: 1.2; font-weight: 600; }
  .joblist .jt small { display: block; color: var(--muted); font-weight: 500; font-size: 14px; }
  .done-btn { border: 0; border-radius: 12px; padding: 10px 14px; background: var(--plus); color: var(--ink-on); font-weight: 800; white-space: nowrap; }
  .done-btn:disabled { background: transparent; color: var(--plus); cursor: default; }
  .x { border: 0; background: transparent; font-size: 22px; padding: 6px 10px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 15px; background: var(--surface); border-radius: 14px; padding: 14px; margin: 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--surface); border: 2px solid transparent; border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 16px; }
  .chip[aria-pressed="true"] { border-color: var(--text); }
  .custom { display: grid; grid-template-columns: 1fr 72px auto; gap: 6px; margin-top: 8px; }
  .custom input { font: inherit; font-size: 16px; padding: 10px; border-radius: 12px; border: 2px solid var(--track); background: var(--surface); color: var(--text); min-width: 0; }
  .custom input:focus { outline: none; border-color: var(--text); }
  .custom button { border: 0; border-radius: 12px; padding: 0 16px; background: var(--text); color: var(--bg); font-weight: 800; }
  .banner { background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); margin-top: 10px; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; visibility: hidden; background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; transition: transform .25s, opacity .25s, visibility .25s; white-space: nowrap; z-index: 20; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Paste your Apps Script link here, then you're live. Leave it blank to try demo mode. ===== */
const CONFIG = {
  DATA_URL: "https://script.google.com/macros/s/AKfycbz9Ya54-mI49qiPLfp1nuiWHC7Wxjs72Thw6TWnHZADqpP_YZsoFCDVkRUpSDokp_o9/exec",        // Apps Script web app URL, ends in /exec
  REFRESH_SECONDS: 30,
  CHILDREN: [
    // photo: upload a picture next to index.html (e.g. millie.jpg) and put its name here. Leave "" for the icon.
    { name: "Millie", theme: "pop", colour: "#ff4fb3", soft: "rgba(255,79,179,.2)", emoji: "🎤", photo: "" },
    { name: "Grace",  theme: "ice", colour: "#1690e6", soft: "rgba(22,144,230,.2)", emoji: "❄️", photo: "" }
  ],
  ACTIONS: [
    { label: "Homework: words", points: 10 },
    { label: "Homework: numbers", points: 10 },
    { label: "Good listening ears", points: 5 },
    { label: "Shared with sister", points: 5 },
    { label: "No fighting today", points: 10 },
    { label: "Tidied toys away", points: 5 },
    { label: "Clothes put away", points: 5 },
    { label: "Plate and cutlery to the sink", points: 3 },
    { label: "Tidied up after themselves", points: 5 },
    { label: "Bedroom cleaned", points: 10 },
    { label: "Kind without being asked", points: 10 },
    { label: "Ate some new food", points: 20 },
    { label: "Fighting or hitting", points: -5 }
  ],
  // Jobs that turn up on their own without setting them up. Remove one from the Plan tab like any other job.
  // who: only these girls (leave out for everyone). days: only these days, 0 Sun, 1 Mon ... 6 Sat (leave out for every day).
  DAILY_JOBS: [
    { id: "teeth", job: "Brushing teeth", points: 5 },
    { id: "bed", job: "Making their bed", points: 5 },
    { id: "homework", job: "Homework", points: 10, who: ["Millie"], days: [1, 2, 3, 4, 5] }
  ],
  // Events on the board count as kids events if they mention a child's name or one of these words. Everything else is grown ups.
  KIDS_WORDS: ["nursery", "school", "pre school", "class", "gymnastic", "swim", "party", "play date", "soft play", "ballet", "dance", "football", "health visitor", "zoo", "farm"],
  DAY_HOURS: [8, 19],   // the hours the calendar always shows. It stretches for anything earlier or later.
  REWARDS: [
    { label: "Treat", cost: 50, emoji: "🍦" },
    { label: "Toy shop", cost: 200, emoji: "🧸" }
  ]
};
/* ================================================================================================ */

const pad = n => String(n).padStart(2, "0");
const stamp = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dayKey = d => stamp(d).slice(0, 10);
const todayKey = () => dayKey(new Date());
const tomorrowKey = () => { const d = new Date(); d.setDate(d.getDate() + 1); return dayKey(d); };
function dayOf(str) {
  const s = String(str || "").trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? `${m[3]}-${pad(m[2])}-${pad(m[1])}` : "";
}
const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const same = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n);
const num = v => Number(String(v || "0").replace("−", "-").replace(/^'/, "")) || 0;
const clean = v => String(v || "").replace(/^'/, "").trim();
const face = ch => ch.photo ? `<img src="${esc(ch.photo)}" alt="">` : ch.emoji;

const state = {
  rows: [], pending: [], jobRows: [], jobPending: [],
  events: null,
  selected: CONFIG.CHILDREN[0].name, lastSent: null, tab: "today", planDay: "today", planBoth: false,
  demo: !CONFIG.DATA_URL, error: null, updated: null, skip: new Set(), codeError: false, checking: false
};
if (state.demo) {
  const t = todayKey();
  state.rows = [
    { id: "d1", date: "", child: "Millie", action: "Bedroom cleaned", points: 10, job: "" },
    { id: "d2", date: "", child: "Grace", action: "Good listening ears", points: 5, job: "" },
    { id: "d3", date: "", child: "Millie", action: "Shared with sister", points: 5, job: "" },
    { id: "d4", date: "", child: "Grace", action: "Kind without being asked", points: 10, job: "" },
    { id: "d5", date: "", child: "Grace", action: "Homework: numbers", points: 10, job: "" }
  ];
  const at = (add, hm) => { const d = new Date(); d.setDate(d.getDate() + add); return dayKey(d) + "T" + hm; };
  state.events = [
    { title: "Nursery", start: at(0, "09:00"), end: at(0, "12:00"), allDay: false },
    { title: "Swimming", start: at(1, "16:30"), end: at(1, "17:15"), allDay: false },
    { title: "Nana and Grandad visiting", start: at(2, "00:00"), end: at(4, "00:00"), allDay: true },
    { title: "Dentist", start: at(3, "10:15"), end: at(3, "10:45"), allDay: false },
    { title: "🎈 Ruby’s party", start: at(5, "13:00"), end: at(5, "15:00"), allDay: false },
    { title: "Park and picnic", start: at(6, "11:00"), end: at(6, "13:00"), allDay: false },
    { title: "Swimming", start: at(8, "16:30"), end: at(8, "17:15"), allDay: false },
    { title: "Hair cut", start: at(10, "10:00"), end: at(10, "10:30"), allDay: false },
    { title: "Farm visit", start: at(12, "00:00"), end: at(13, "00:00"), allDay: true }
  ];
  state.jobRows = [
    { id: "j1", day: t, child: "Millie", job: "Homework: words", points: 10, status: "added" },
    { id: "j2", day: "daily", child: "Millie", job: "Clothes put away", points: 5, status: "added" },
    { id: "j3", day: t, child: "Grace", job: "Homework: numbers", points: 10, status: "added" },
    { id: "j4", day: "daily", child: "Grace", job: "Tidied toys away", points: 5, status: "added" }
  ];
}

/* Small storage helpers that never throw */
const store = {
  get(area, k) { try { return window[area].getItem(k); } catch (e) { return store.mem[k] || null; } },
  set(area, k, v) { try { window[area].setItem(k, v); } catch (e) { store.mem[k] = v; } },
  del(area, k) { try { window[area].removeItem(k); } catch (e) { delete store.mem[k]; } },
  mem: {}
};
const nav = { view: location.hash === "#admin" ? "admin" : "board" };
const route = () => nav.view;
function go(view) {
  nav.view = view;
  try { history.replaceState(null, "", view === "admin" ? "#admin" : location.pathname + location.search); } catch (e) {}
  state.codeError = false;
  render();
  try { window.scrollTo(0, 0); } catch (e) {}
}

/* Grown ups gate: a sum the girls can't do yet. Unlocked until this tab is closed or you tap Lock. */
const gate = { a: 0, b: 0, wrong: false };
/* An easy adding sum for grown ups that a four year old can't do yet, like 17 + 6 */
function newSum() { gate.a = 11 + Math.floor(Math.random() * 18); gate.b = 3 + Math.floor(Math.random() * 7); }
newSum();
const isUnlocked = () => store.get("sessionStorage", "pb-unlocked") === "1";
function checkGate() {
  const v = parseInt((document.getElementById("answer") || {}).value, 10);
  if (v === gate.a + gate.b) { gate.wrong = false; store.set("sessionStorage", "pb-unlocked", "1"); }
  else { gate.wrong = true; newSum(); }
  state.skip.add("answer");
  render();
}
function lock() { store.del("sessionStorage", "pb-unlocked"); newSum(); go("board"); }

/* Family code: entered once per phone, checked by the Apps Script on every change */
const getCode = () => store.get("localStorage", "pb-code") || "";
async function saveCode() {
  const v = (document.getElementById("code") || {}).value || "";
  if (!v.trim()) return;
  state.checking = true; render();
  try {
    const r = await api({ action: "check", key: v.trim() });
    if (r.ok) { store.set("localStorage", "pb-code", v.trim()); state.codeError = false; toast("Phone set up"); }
    else { state.codeError = "wrong"; state.skip.add("code"); }
  } catch (e) { state.codeError = "offline"; }
  state.checking = false; render();
}

/* Reading the sheet */
function table(rows, keys) {
  if (!rows || !rows.length) return [];
  const h = rows[0].map(x => String(x).trim().toLowerCase());
  const idx = keys.map(k => h.indexOf(k));
  return rows.slice(1).map(r => { const o = {}; keys.forEach((k, i) => o[k] = idx[i] >= 0 ? clean(r[idx[i]]) : ""); return o; });
}
const toEntries = rows => table(rows, ["date", "child", "action", "points", "id", "job"])
  .filter(r => r.child).map(r => ({ ...r, points: num(r.points) }));
const toJobs = rows => table(rows, ["date", "child", "job", "points", "id", "status"])
  .filter(r => r.child && r.id).map(r => ({
    id: r.id, child: r.child, job: r.job, points: num(r.points), status: (r.status || "added").toLowerCase(),
    day: same(r.date, "daily") ? "daily" : dayOf(r.date)
  }));

async function api(params) {
  const url = CONFIG.DATA_URL;
  const res = await fetch(url + (url.includes("?") ? "&" : "?") + new URLSearchParams({ ...params, t: Date.now() }), { cache: "no-store" });
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

function entries() {
  const ids = new Set(state.rows.map(r => r.id));
  return state.rows.concat(state.pending.filter(p => !ids.has(p.id)));
}
function allJobs() {
  const seen = new Set(state.jobRows.map(r => r.id + "|" + r.status));
  const map = new Map();
  const weekday = new Date().getDay();
  CONFIG.CHILDREN.forEach(ch => CONFIG.DAILY_JOBS.forEach(d => {
    if (d.who && !d.who.some(n => same(n, ch.name))) return;
    if (d.days && !d.days.includes(weekday)) return;
    // Jobs for set days get today's date in the id, so removing one only skips today
    const id = `daily-${d.id}-${ch.name.toLowerCase()}` + (d.days ? `-${todayKey()}` : "");
    map.set(id, { id, day: d.days ? todayKey() : "daily", child: ch.name, job: d.job, points: d.points, status: "added" });
  }));
  state.jobRows.concat(state.jobPending.filter(p => !seen.has(p.id + "|" + p.status))).forEach(j => map.set(j.id, j));
  return [...map.values()].filter(j => j.status !== "removed");
}
const forChild = (name, list) => list.filter(e => same(e.child, name));
const balanceOf = (name, list) => forChild(name, list).reduce((s, e) => s + e.points, 0);
const jobsFor = (name, key, withDaily) => allJobs().filter(j => same(j.child, name) && (j.day === key || (withDaily && j.day === "daily")));
const isDone = (job, list) => list.filter(e => e.job === job.id && dayOf(e.date) === todayKey()).reduce((s, e) => s + e.points, 0) > 0;

async function load() {
  if (!state.demo) {
    try {
      const data = await api({ action: "read" });
      state.rows = toEntries(data.transactions);
      state.jobRows = toJobs(data.jobs);
      state.events = Array.isArray(data.events) ? data.events : null;
      const cutoff = Date.now() - 15 * 60 * 1000;
      const ids = new Set(state.rows.map(r => r.id));
      state.pending = state.pending.filter(p => !ids.has(p.id) && p.ts > cutoff);
      const seen = new Set(state.jobRows.map(r => r.id + "|" + r.status));
      state.jobPending = state.jobPending.filter(p => !seen.has(p.id + "|" + p.status) && p.ts > cutoff);
      state.error = null; state.updated = new Date();
    } catch (e) {
      state.error = "Can’t reach the points sheet. Check the link at the top of the page.";
    }
  }
  render();
}

/* Writing to the sheet */
function write(params, undoLocal) {
  if (state.demo) return;
  api({ ...params, action: "add", key: getCode() }).then(r => {
    if (r && r.ok) return;
    undoLocal();
    if (r && r.error === "code") { store.del("localStorage", "pb-code"); state.codeError = true; toast("Family code needed"); }
    else toast("Not saved. Try again.");
    render();
  }).catch(() => { undoLocal(); toast("Not saved. Check your connection and try again."); render(); });
}
function send(child, action, points, message, jobId) {
  const now = new Date();
  const entry = { id: newId(), date: stamp(now), child, action, points, job: jobId || "", ts: now.getTime() };
  if (state.demo) state.rows.push(entry);
  else {
    state.pending.push(entry);
    write({ type: "points", id: entry.id, date: entry.date, child, label: action, points, job: entry.job },
      () => { state.pending = state.pending.filter(p => p !== entry); if (state.lastSent === entry) state.lastSent = null; });
  }
  state.lastSent = entry;
  toast(message);
  render();
}
function writeJob(job) {
  if (state.demo) { state.jobRows.push(job); return; }
  const p = { ...job, ts: Date.now() };
  state.jobPending.push(p);
  write({ type: "job", id: job.id, date: job.day, child: job.child, job: job.job, points: job.points, status: job.status },
    () => { state.jobPending = state.jobPending.filter(x => x !== p); });
}
function addJob(title, points) {
  const day = state.planDay === "today" ? todayKey() : state.planDay === "tomorrow" ? tomorrowKey() : "daily";
  const who = state.planBoth ? CONFIG.CHILDREN.map(c => c.name) : [state.selected];
  who.forEach(child => writeJob({ id: newId(), day, child, job: title, points, status: "added" }));
  toast(`Added for ${who.join(" and ")}`);
  render();
}
function removeJob(id) {
  const j = allJobs().find(x => x.id === id); if (!j) return;
  writeJob({ ...j, status: "removed" });
  toast("Job removed");
  render();
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ============ TV view ============ */
function rng(seed) { let x = seed; return () => (x = (x * 16807) % 2147483647) / 2147483647; }
const f1 = n => n.toFixed(1);

/* Each girl's world is drawn once, so the twinkles and snow keep moving through the 30 second refreshes */
function twinkles(r, n, cls) {
  let out = "";
  for (let i = 0; i < n; i++)
    out += `<i class="twinkle ${cls}" style="--x:${f1(r() * 98)}%;--y:${f1(r() * 62)}%;--s:${(0.22 + r() * 0.3).toFixed(2)}rem;--d:${f1(2.5 + r() * 4)}s;--t:-${f1(r() * 6)}s"></i>`;
  return out;
}
function popWorld() {
  const r = rng(7);
  let x = 0, blocks = "", wins = "";
  while (x < 400) {
    const w = 22 + Math.floor(r() * 30), h = 30 + Math.floor(r() * 70);
    blocks += `<rect x="${x}" y="${130 - h}" width="${w - 3}" height="${h}"/>`;
    for (let wy = 130 - h + 8; wy < 122; wy += 11)
      for (let wx = x + 5; wx < x + w - 8; wx += 9)
        if (r() > .55) wins += `<rect x="${wx}" y="${wy}" width="3.5" height="4.5" rx="1" fill="${r() > .5 ? "#FFD45C" : "#FF9AD5"}" opacity="${f1(.5 + r() * .5)}"/>`;
    x += w;
  }
  let sparks = "";
  for (let i = 0; i < 10; i++) {
    const c = r();
    sparks += `<i class="spark star4 ${c < .4 ? "gold" : c < .7 ? "pink" : ""}" style="--x:${f1(r() * 94)}%;--y:${f1(45 + r() * 45)}%;--s:${(.5 + r() * .7).toFixed(2)}rem;--d:${f1(7 + r() * 6)}s;--t:-${f1(r() * 12)}s"></i>`;
  }
  return `<div class="world" aria-hidden="true">
    <i class="beam b1"></i><i class="beam b2"></i>${twinkles(r, 22, "pinkstar")}
    <svg class="scenery" viewBox="0 0 400 130" preserveAspectRatio="xMidYMax slice"><g fill="#140628">${blocks}</g><g class="wins">${wins}</g></svg>
    ${sparks}

/* Pictures matter more than words: the girls can't read yet. A leading emoji in a name always wins. */
const LEAD_EMOJI = /^(\p{Extended_Pictographic}(️|‍\p{Extended_Pictographic})*)\s*/u;
function pickIcon(text, table, fallback) {
  const m = String(text).match(LEAD_EMOJI);
  if (m) return { icon: m[1], text: String(text).slice(m[0].length) };
  const hit = table.find(([re]) => re.test(text));
  return { icon: hit ? hit[1] : fallback, text: String(text) };
}
const JOB_ICONS = [
  [/teeth|brush/i, "🦷"], [/\bbed\b/i, "🛏️"], [/words?\b|spelling|phonics/i, "🔤"], [/numbers?\b|maths?\b|sums/i, "🔢"],

];
const eventIcon = title => pickIcon(title, ICONS, "📅");
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
const shortDay = d => d.toLocaleDateString("en-GB", { weekday: "short" });
/* Who an event is for: one girl, "kids" for both or a kids activity, or "" for grown ups */
function eventFor(title) {
  const named = CONFIG.CHILDREN.filter(ch => new RegExp("\\b" + ch.name + "\\b", "i").test(title));
  if (named.length === 1) return named[0];
  if (named.length > 1 || CONFIG.KIDS_WORDS.some(w => new RegExp("\\b" + w, "i").test(title))) return "kids";
  return "";
}
const minsOf = s => { const m = String(s).match(/T(\d\d):(\d\d)/); return m ? +m[1] * 60 + +m[2] : 0; };
const hourLabel = h => h % 24 === 0 ? "12am" : h === 12 ? "12pm" : h < 12 ? `${h}am` : `${h - 12}pm`;
const timeLabel = s => String(s).slice(11, 16).replace(/^0/, "");

/* Today plus the next six days as a time grid: days across, hours down */
function weekHtml() {
  if (!state.events) return `<div class="wk-empty">The calendar isn’t available right now</div>`;
  const now = new Date();
  const days = Array.from({ length: 7 }, (_, i) => addDays(now, i));
  const keys = days.map(dayKey), first = keys[0], last = keys[6];
  const nowStamp = stamp(now).replace(" ", "T");
  const label = i => i === 0 ? "Today" : i === 1 ? "Tomorrow" : shortDay(days[i]);

  const spans = [], timed = days.map(() => []);
  state.events.forEach(ev => {
    const s = String(ev.start).slice(0, 10);
    if (ev.allDay) {
      const e = String(ev.end).slice(0, 10);
      const lastDay = e > s ? dayKey(addDays(new Date(e + "T12:00"), -1)) : s;
      if (lastDay < first || s > last) return;
      spans.push({ ev, a: keys.indexOf(s < first ? first : s), b: keys.indexOf(lastDay > last ? last : lastDay) });
    } else {
      const i = keys.indexOf(s); if (i < 0) return;
      const start = minsOf(ev.start);
      let end = String(ev.end).slice(0, 10) > s ? 24 * 60 : minsOf(ev.end);
      if (end <= start) end = start + 30;
      timed[i].push({ ev, start, end });
    }
  });

  // Hours shown: the usual day, stretched to fit anything earlier or later this week
  let lo = CONFIG.DAY_HOURS[0], hi = CONFIG.DAY_HOURS[1];
  timed.flat().forEach(t => { lo = Math.min(lo, Math.floor(t.start / 60)); hi = Math.max(hi, Math.ceil(t.end / 60)); });
  hi = Math.min(24, Math.max(hi, lo + 1));
  const total = (hi - lo) * 60;
  const pos = m => Math.max(0, Math.min(100, (m - lo * 60) / total * 100));

  const heads = days.map((d, i) => `<div class="wk-day ${i === 0 ? "is-today" : ""} ${[0, 6].includes(d.getDay()) ? "is-weekend" : ""}" style="grid-column:${i + 2}">
      <span class="wk-dn">${label(i)}</span><span class="wk-num">${d.getDate()}</span></div>`).join("");

  const spanHtml = spans.sort((x, y) => x.a - y.a || (y.b - y.a) - (x.b - x.a)).map(({ ev, a, b }) => {
    const { icon, text } = eventIcon(ev.title || "");
    const kind = eventFor(ev.title || "") ? "is-kids" : "is-grown";
    const when = a === b ? "" : `<span class="wk-when">${a === 0 ? "today" : shortDay(days[a])} to ${shortDay(days[b])}</span>`;
    return `<div class="wk-span ${kind}" style="grid-column:${a + 1} / ${b + 2}"><span class="wk-i" aria-hidden="true">${icon}</span><span class="wk-st">${esc(text)}${when}</span></div>`;
  }).join("");

  // A block is never shorter than 4.7rem, so work out how many minutes that covers on this screen
  const remPx = parseFloat(getComputedStyle(document.documentElement).fontSize) || 11;
  const prev = document.querySelector(".wk-cols");
  const colPx = prev && prev.clientHeight > 50 ? prev.clientHeight : window.innerHeight * .55;
  const minMins = Math.max(30, Math.ceil(4.7 * remPx / (colPx / (hi - lo)) * 60));
  const cols = timed.map((list, i) => {
    // Events that overlap (or would look like they do) sit side by side
    list.sort((x, y) => x.start - y.start || y.end - x.end);
    let group = [], groupEnd = -1;
    const flush = () => {
      const lanes = [];
      group.forEach(t => { let l = lanes.findIndex(end => end <= t.start); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = Math.max(t.end, t.start + minMins); t.lane = l; });
      group.forEach(t => t.lanes = lanes.length);
      group = []; groupEnd = -1;
    };
    list.forEach(t => { if (group.length && t.start >= groupEnd) flush(); group.push(t); groupEnd = Math.max(groupEnd, t.end, t.start + minMins); });
    flush();
    const evs = list.map(t => {
      const { icon, text } = eventIcon(t.ev.title || "");
      const kind = eventFor(t.ev.title || "") ? "is-kids" : "is-grown";
      const past = String(t.ev.end) <= nowStamp ? "is-past" : "";
      const top = pos(t.start), h = Math.max(0, pos(t.end) - top);
      return `<div class="wk-ev ${kind} ${past} ${t.lanes >= 3 ? "is-narrow" : ""}" title="${esc(t.ev.title || "")}" style="top:min(${f1(top)}%, calc(100% - 4.7rem));height:${f1(h)}%;left:${f1(t.lane / t.lanes * 100)}%;width:${f1(100 / t.lanes)}%">
        <span class="wk-et"><span class="wk-i" aria-hidden="true">${icon}</span><b>${esc(text)}</b></span><span class="wk-tm">${timeLabel(t.ev.start)}</span></div>`;
    }).join("");
    const nowMins = now.getHours() * 60 + now.getMinutes();
    const line = i === 0 && nowMins >= lo * 60 && nowMins <= hi * 60 ? `<div class="wk-now" style="top:${f1(pos(nowMins))}%"></div>` : "";
    return `<div class="wk-col">${evs}${line}</div>`;
  }).join("");

  const hours = Array.from({ length: hi - lo }, (_, k) => `<span style="--y:${f1(k / (hi - lo) * 100)}%">${hourLabel(lo + k)}</span>`).join("");
  return `<div class="wk-grid" style="--hours:${hi - lo}">
    <div class="wk-todaybg"></div>${heads}
    <div class="wk-spans">${spanHtml}</div>
    <div class="wk-hours">${hours}</div>
    <div class="wk-cols">${cols}</div>
  </div>`;
}

function kidHtml(ch, list) {
  const bal = balanceOf(ch.name, list);
  const rewards = CONFIG.REWARDS.slice().sort((a, b) => a.cost - b.cost);
  const top = rewards[rewards.length - 1];
  const pct = bal <= 0 ? 0 : Math.max(6, Math.min(100, bal / top.cost * 100));
  const next = rewards.find(r => r.cost > bal);
  const jobs = jobsFor(ch.name, todayKey(), true);
  const doneCount = jobs.filter(j => isDone(j, list)).length;
  const goals = rewards.map(r => `<div class="goal-mark ${bal >= r.cost ? "got" : ""}" style="bottom:${f1(r.cost / top.cost * 100)}%"><span class="gi">${r.emoji}</span>${r.cost}</div>`).join("");
  const digits = String(Math.abs(bal)).length + (bal < 0 ? 1 : 0);
  const items = jobs.map(j => {
    const d = isDone(j, list);
    const { icon, text } = jobIcon(j.job);
    return `<li class="job ${d ? "done" : ""}"><button class="tick" data-tick="${esc(j.id)}" aria-pressed="${d}" aria-label="${esc(j.job)}, ${d ? "done, tap to undo" : "tap when done"}">
      <span class="job-i" aria-hidden="true">${icon}${d ? `<span class="job-ok">✓</span>` : ""}</span><span class="job-n">${esc(text)}</span><span class="job-p">+${j.points}</span></button></li>`;
  }).join("");
  return `
    <div class="kc-head"><span class="kc-av" aria-hidden="true">${face(ch)}</span><h2 class="kc-name">${esc(ch.name)}</h2></div>
    <div class="bank">
      <div class="tower" role="img" aria-label="${bal} of ${top.cost} points">
        <div class="tower-track"><div class="tower-fill" style="transform:translateY(${f1(100 - pct)}%)"></div></div>${goals}
      </div>
      <div class="score" style="--num:${digits >= 3 ? 4.6 : digits === 2 ? 6 : 7}rem">
        <div class="score-num">${bal}</div><div class="score-l">points</div>
        <div class="next">${next ? `${next.cost - bal} more for <span>${next.emoji}</span>` : `${esc(top.label)} time! <span>${top.emoji}</span>`}</div>
      </div>
    </div>
    <div class="jobs">
      <div class="jobs-h"><h3>Today’s jobs</h3><span>${jobs.length && doneCount === jobs.length ? "All done! 🎉" : `${doneCount} of ${jobs.length}`}</span></div>
      ${jobs.length ? `<ul>${items}</ul>` : `<p class="jobs-none">No jobs today</p>`}
    </div>`;
}

/* Render, keeping anything half typed through the refresh */
function render() {
  const app = document.getElementById("app");
  document.body.classList.toggle("on-board", route() !== "admin");
  if (route() !== "admin") {
    if (app.querySelector(".tv")) patchBoard(); else app.innerHTML = renderBoard();
    fitCards();
    return;
  }
  const saved = {};
  app.querySelectorAll("input").forEach(i => saved[i.id] = i.value);
  const focusId = document.activeElement && app.contains(document.activeElement) ? document.activeElement.id : "";
  let view;
  if (!isUnlocked()) view = renderGate();
  else if (!state.demo && !getCode()) view = renderCode();
  else view = renderAdmin();
  app.innerHTML = view;
  app.querySelectorAll("input").forEach(i => { if (i.id in saved && !state.skip.has(i.id)) i.value = saved[i.id]; });
  state.skip.clear();
  const f = focusId && document.getElementById(focusId);
  if (f) f.focus();
  else { const first = document.getElementById("answer") || document.getElementById("code"); if (first) first.focus(); }
}

document.getElementById("app").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const name = state.selected;
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.tick) {
    const j = allJobs().find(x => x.id === b.dataset.tick); if (!j) return;
    if (!state.demo && !getCode()) { toast("This device needs the family code first. Tap Grown ups to set it up."); return; }
    if (isDone(j, entries())) return send(j.child, `Undo: Job: ${j.job}`, -j.points, `Unticked ${j.job}`, j.id);
    return send(j.child, `Job: ${j.job}`, j.points, `${signed(j.points)} for ${j.child}! Well done 🎉`, j.id);
  }
  if (b.hasAttribute("data-check")) return checkGate();
  if (b.hasAttribute("data-savecode")) return saveCode();
  if (b.hasAttribute("data-lock")) return lock();
  if (b.dataset.kid) { state.selected = b.dataset.kid; return render(); }
  if (b.dataset.tab) { state.tab = b.dataset.tab; return render(); }
  if (b.dataset.planday) { state.planDay = b.dataset.planday; return render(); }
  if (b.hasAttribute("data-both")) { state.planBoth = !state.planBoth; return render(); }
  if (b.dataset.quick) return addJob(b.dataset.quick, num(b.dataset.pts));
  if (b.hasAttribute("data-addcustom")) {
    const title = document.getElementById("jobname").value.trim();
    const pts = Math.max(1, Math.round(num(document.getElementById("jobpts").value)));
    if (!title) { toast("Type a job name first"); return document.getElementById("jobname").focus(); }
    state.skip.add("jobname");
    return addJob(title, pts);
  }
  if (b.dataset.remove) return removeJob(b.dataset.remove);
  if (b.dataset.done) {
    const j = allJobs().find(x => x.id === b.dataset.done); if (!j) return;
    return send(j.child, `Job: ${j.job}`, j.points, `${signed(j.points)} for ${j.child}`, j.id);
  }
  if (b.dataset.act !== undefined) {
    const a = CONFIG.ACTIONS[+b.dataset.act];
    return send(name, a.label, a.points, `${signed(a.points)} for ${name}`);
  }
  if (b.dataset.reward !== undefined) {
    const r = CONFIG.REWARDS[+b.dataset.reward];
    if (confirm(`Spend ${r.cost} of ${name}’s points on ${r.label.toLowerCase()}?`))
      send(name, `Spent: ${r.label}`, -r.cost, `${name} spent ${r.cost} points`);
    return;
  }
  if (b.hasAttribute("data-undo") && state.lastSent) {
    const l = state.lastSent;
    send(l.child, `Undo: ${l.action}`, -l.points, "Undone", l.job);
    state.lastSent = null; render();
  }
});
document.getElementById("app").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "answer") checkGate();
  if (e.target.id === "code") saveCode();
  if (e.target.id === "jobname" || e.target.id === "jobpts") document.querySelector("[data-addcustom]").click();
});
window.addEventListener("hashchange", () => { const v = location.hash === "#admin" ? "admin" : "board"; if (v !== nav.view) go(v); });
load();
setInterval(load, CONFIG.REFRESH_SECONDS * 1000);
setInterval(() => { if (route() !== "admin") location.reload(); }, 60 * 60 * 1000);
</script>
</body>
